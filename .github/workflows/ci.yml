name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# Every job here reads the repository and writes nothing back. Stating that in
# the workflow keeps it true if the repository default ever widens, rather than
# leaving the token's reach to a setting held outside version control
# (CODEX-REVIEW.md L-03).
permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.0', '8.1', '8.2', '8.3' ]

    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint PHP
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run unit tests
        run: ./vendor/bin/phpunit

  static:
    name: Syntax and shell checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Check JavaScript syntax
        run: for f in assets/js/*.js; do node --check "$f"; done

      - name: Check build script syntax
        run: bash -n bin/build-zip.sh bin/verify-zip.sh

      - name: Check integration test syntax
        run: for f in tests/integration/*.mjs; do node --check "$f"; done

  analyse:
    name: Static analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Runs on 8.3 and judges the code as 7.4, which phpstan.neon.dist sets.
      # The stub packages need a modern PHP to install; the plugin's own floor
      # is what the analysis is against, not what it runs on.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Analyse
        run: composer analyse

      - name: Coding standards
        run: composer sniff

  package:
    name: Package parity
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # A green test suite says nothing about what was packaged: v1.2.0 was
      # built before its own fix landed and shipped a superseded class
      # (CODEX-REVIEW.md M-01). Building the archive and diffing it against the
      # worktree is the check that would have caught it.
      - name: Build the plugin zip
        run: bash bin/build-zip.sh

      - name: Verify the zip matches the source
        run: bash bin/verify-zip.sh

  integration:
    name: WooCommerce ${{ matrix.woocommerce }} blocks
    runs-on: ubuntu-latest

    # The unit suite structurally cannot catch a cross-plugin failure: the stubs
    # model this plugin's callbacks, not WooCommerce's competing ones. A green
    # 127-test suite once coexisted with a Checkout block that never rendered
    # (CODEX-REVIEW.md H-01, M-02). This job installs the built zip into a real
    # WordPress and drives the blocks in a real browser.
    strategy:
      fail-fast: false
      matrix:
        # Floor of the declared compatibility range, and whatever is current —
        # so a future WooCommerce that breaks the blocks turns CI red here
        # rather than in someone's store.
        woocommerce: [ '9.9.5', 'latest' ]

    env:
      BASE: http://localhost:8910
      BOGO_DIST: ${{ github.workspace }}/dist
      BOGO_TESTS: ${{ github.workspace }}/tests/integration

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      # Install the artifact customers get, not the worktree.
      - name: Build the plugin zip
        run: bash bin/build-zip.sh

      - name: Start WordPress
        run: |
          docker compose -f tests/integration/docker-compose.yml up -d
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8910/ || true)
            case "$code" in 200|301|302) echo "web up ($code)"; exit 0;; esac
            sleep 3
          done
          echo "WordPress did not come up"
          docker compose -f tests/integration/docker-compose.yml logs --tail=60
          exit 1

      - name: Install WordPress
        run: |
          C="docker compose -f tests/integration/docker-compose.yml exec -T cli"
          $C wp core install --url=http://localhost:8910 --title="BOGO CI" \
            --admin_user=admin --admin_password=admin \
            --admin_email=ci@example.com --skip-email
          $C wp rewrite structure '/%postname%/'
          # Pretty permalinks need mod_rewrite and .htaccess honoured; the base
          # image ships neither enabled.
          docker compose -f tests/integration/docker-compose.yml exec -T wp bash -c \
            'a2enmod rewrite >/dev/null && sed -i "s|AllowOverride None|AllowOverride All|g" /etc/apache2/apache2.conf && apache2ctl graceful'
          sleep 3
          $C wp rewrite flush --hard

      # BRIEF.md §6 asks for no PHP notices or warnings with WP_DEBUG on, and
      # nothing had ever checked it (CODEX-REVIEW.md L-02). Logged rather than
      # displayed: a notice printed into the page would break the browser tests
      # in a way that says nothing about what raised it.
      - name: Turn on WP_DEBUG
        run: |
          C="docker compose -f tests/integration/docker-compose.yml exec -T cli"
          $C wp config set WP_DEBUG true --raw
          $C wp config set WP_DEBUG_LOG true --raw
          $C wp config set WP_DEBUG_DISPLAY false --raw

      - name: Install WooCommerce and the plugin
        run: |
          C="docker compose -f tests/integration/docker-compose.yml exec -T cli"
          if [ "${{ matrix.woocommerce }}" = "latest" ]; then
            $C wp plugin install woocommerce --activate
          else
            $C wp plugin install woocommerce --version=${{ matrix.woocommerce }} --activate
          fi
          # Name the archive exactly. A glob would match every previously built
          # version in dist/ — harmless on a fresh CI checkout, silently wrong
          # for anyone running this locally.
          VERSION=$(grep -m1 -oP '^\s*\*\s*Version:\s*\K[0-9A-Za-z.\-+]+' bogo-select.php)
          echo "installing bogo-select ${VERSION}"
          $C wp plugin install "/artifact/bogo-select-${VERSION}.zip" --activate
          $C wp plugin list --fields=name,status,version
          # Fail loudly if anything but the version under test ended up active.
          $C wp plugin get bogo-select --field=version | tr -d '\r' | grep -qx "${VERSION}"

      - name: Seed the store
        id: seed
        run: |
          C="docker compose -f tests/integration/docker-compose.yml exec -T cli"
          OUT=$($C wp eval-file /integration/setup-store.php | tail -1 | tr -d '\r')
          echo "seed: $OUT"
          echo "paid=$(echo "$OUT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["paid"])')" >> "$GITHUB_OUTPUT"
          echo "gift=$(echo "$OUT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["gift_a"])')" >> "$GITHUB_OUTPUT"

      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium

      - name: Run the block integration test
        env:
          PAID_ID: ${{ steps.seed.outputs.paid }}
          GIFT_ID: ${{ steps.seed.outputs.gift }}
          WC_VERSION: ${{ matrix.woocommerce }}
        run: node tests/integration/blocks.test.mjs

      # Runs second, and only after the free path has been proven, because it
      # rewrites the seeded offer in place rather than rebuilding the store.
      - name: Switch the offer to a percentage discount
        run: |
          C="docker compose -f tests/integration/docker-compose.yml exec -T cli"
          $C wp eval-file /integration/set-discount.php | tail -1 | tr -d '\r'

      - name: Run the discounted reward integration test
        env:
          PAID_ID: ${{ steps.seed.outputs.paid }}
          GIFT_ID: ${{ steps.seed.outputs.gift }}
          GIFT_PRICE: 10
          DISCOUNT_PERCENT: 50
          WC_VERSION: ${{ matrix.woocommerce }}
        run: node tests/integration/discount.test.mjs

      # Adds a variable product to the same store and makes it the offer. Runs
      # last because it narrows the Get list to that one product.
      - name: Add a variable product and offer it
        id: variable
        run: |
          C="docker compose -f tests/integration/docker-compose.yml exec -T cli"
          OUT=$($C wp eval-file /integration/setup-variable.php | tail -1 | tr -d '\r')
          echo "variable: $OUT"
          for k in parent small large; do
            echo "$k=$(echo "$OUT" | python3 -c "import json,sys; print(json.load(sys.stdin)['$k'])")" >> "$GITHUB_OUTPUT"
          done

      - name: Run the variable reward integration test
        env:
          PAID_ID: ${{ steps.seed.outputs.paid }}
          PARENT_ID: ${{ steps.variable.outputs.parent }}
          SMALL_ID: ${{ steps.variable.outputs.small }}
          LARGE_ID: ${{ steps.variable.outputs.large }}
          LARGE_PRICE: 18
          DISCOUNT_PERCENT: 50
          WC_VERSION: ${{ matrix.woocommerce }}
        run: node tests/integration/variable.test.mjs

      # Order placement, order metadata, and stock reduction — the surfaces
      # BRIEF.md §8.6 listed as manual and CODEX-REVIEW.md M-03 called out. Runs
      # last because placing an order consumes the cart and the fixture's stock.
      - name: Seed the order fixture
        id: order
        run: |
          C="docker compose -f tests/integration/docker-compose.yml exec -T cli"
          OUT=$($C wp eval-file /integration/setup-order.php | tail -1 | tr -d '\r')
          echo "order fixture: $OUT"
          for k in paid reward paid_stock reward_stock; do
            echo "$k=$(echo "$OUT" | python3 -c "import json,sys; print(json.load(sys.stdin)['$k'])")" >> "$GITHUB_OUTPUT"
          done

      # Settles the coupon-stacking claim the documentation had been making on
      # the strength of hook ordering alone. Runs before the order lane, which
      # is left last because it consumes the fixture's stock.
      - name: Seed the coupons
        id: coupons
        run: |
          C="docker compose -f tests/integration/docker-compose.yml exec -T cli"
          OUT=$($C wp eval-file /integration/setup-coupon.php ${{ steps.order.outputs.reward }} | tail -1 | tr -d '\r')
          echo "coupons: $OUT"
          for k in stacking excluding; do
            echo "$k=$(echo "$OUT" | python3 -c "import json,sys; print(json.load(sys.stdin)['$k'])")" >> "$GITHUB_OUTPUT"
          done

      - name: Run the coupon integration test
        env:
          BASE: http://localhost:8910
          PAID_ID: ${{ steps.order.outputs.paid }}
          REWARD_ID: ${{ steps.order.outputs.reward }}
          REWARD_PRICE: 20
          GET_QTY: 2
          DISCOUNT_PERCENT: 50
          COUPON_PERCENT: 20
          STACKING_CODE: ${{ steps.coupons.outputs.stacking }}
          EXCLUDING_CODE: ${{ steps.coupons.outputs.excluding }}
        run: node tests/integration/coupon.test.mjs

      - name: Place a real order
        id: placed
        env:
          BASE: http://localhost:8910
          PAID_ID: ${{ steps.order.outputs.paid }}
          REWARD_ID: ${{ steps.order.outputs.reward }}
          REWARD_PRICE: 20
          GET_QTY: 2
          DISCOUNT_PERCENT: 50
        run: |
          OUT=$(node tests/integration/order.test.mjs | tee /dev/stderr | tail -1)
          echo "order_id=$(echo "$OUT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["order_id"])')" >> "$GITHUB_OUTPUT"

      - name: Assert the order, its metadata, and stock
        run: |
          C="docker compose -f tests/integration/docker-compose.yml exec -T cli"
          $C wp eval-file /integration/assert-order.php \
            ${{ steps.placed.outputs.order_id }} \
            ${{ steps.order.outputs.reward }} \
            ${{ steps.order.outputs.paid }} \
            2 20 \
            $(( ${{ steps.order.outputs.reward_stock }} - 2 )) \
            $(( ${{ steps.order.outputs.paid_stock }} - 1 ))

      # The shortcode cart and checkout. Different code from the blocks on both
      # sides — the chooser arrives through template hooks rather than the
      # render_block filter, and selection goes over admin-ajax. Runs last
      # because it repoints the store's cart and checkout pages.
      - name: Switch the store to classic shortcode pages
        id: classic
        run: |
          C="docker compose -f tests/integration/docker-compose.yml exec -T cli"
          OUT=$($C wp eval-file /integration/setup-classic.php | tail -1 | tr -d '\r')
          echo "classic: $OUT"
          for k in paid reward variable small large; do
            echo "$k=$(echo "$OUT" | python3 -c "import json,sys; print(json.load(sys.stdin)['$k'])")" >> "$GITHUB_OUTPUT"
          done

      - name: Run the classic cart and checkout integration test
        env:
          PAID_ID: ${{ steps.classic.outputs.paid }}
          REWARD_ID: ${{ steps.classic.outputs.reward }}
          REWARD_PRICE: 24
          VARIABLE_ID: ${{ steps.classic.outputs.variable }}
          SMALL_ID: ${{ steps.classic.outputs.small }}
          LARGE_ID: ${{ steps.classic.outputs.large }}
          LARGE_PRICE: 50
          DISCOUNT_PERCENT: 50
          CART_PATH: /classic-cart/
          CHECKOUT_PATH: /classic-checkout/
          WC_VERSION: ${{ matrix.woocommerce }}
        run: node tests/integration/classic.test.mjs

      # Q-004's shipping claim, which had never been checked because every other
      # fixture is virtual. Runs its own store setup twice, once per mode.
      - name: Shipping, free reward
        run: |
          C="docker compose -f tests/integration/docker-compose.yml exec -T cli"
          OUT=$($C wp eval-file /integration/setup-shipping.php free | tail -1 | tr -d '\r')
          echo "shipping free: $OUT"
          PAID=$(echo "$OUT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["paid"])')
          REWARD=$(echo "$OUT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["reward"])')
          MODE=free PAID_ID="$PAID" REWARD_ID="$REWARD" PAID_PRICE=45 REWARD_VALUE=20 \
            THRESHOLD=50 DISCOUNT_PERCENT=50 node tests/integration/shipping.test.mjs

      - name: Shipping, discounted reward
        run: |
          C="docker compose -f tests/integration/docker-compose.yml exec -T cli"
          OUT=$($C wp eval-file /integration/setup-shipping.php percent | tail -1 | tr -d '\r')
          echo "shipping percent: $OUT"
          PAID=$(echo "$OUT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["paid"])')
          REWARD=$(echo "$OUT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["reward"])')
          MODE=percent PAID_ID="$PAID" REWARD_ID="$REWARD" PAID_PRICE=45 REWARD_VALUE=20 \
            THRESHOLD=50 DISCOUNT_PERCENT=50 node tests/integration/shipping.test.mjs

      # D-016 discounts the effective selling price, so a reward already reduced
      # is reduced again from its sale figure. Decided on paper; checked here.
      - name: A reward already on sale, discounted again
        run: |
          C="docker compose -f tests/integration/docker-compose.yml exec -T cli"
          OUT=$($C wp eval-file /integration/setup-sale.php | tail -1 | tr -d '\r')
          echo "sale: $OUT"
          PAID=$(echo "$OUT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["paid"])')
          REWARD=$(echo "$OUT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["reward"])')
          PAID_ID="$PAID" REWARD_ID="$REWARD" REGULAR_PRICE=40 SALE_PRICE=20 \
            DISCOUNT_PERCENT=50 node tests/integration/sale.test.mjs

      # Tax is where a wrong answer costs a store money, so both display modes
      # are exercised. Runs last: it leaves taxes enabled.
      - name: Tax, prices excluding tax
        run: |
          C="docker compose -f tests/integration/docker-compose.yml exec -T cli"
          OUT=$($C wp eval-file /integration/setup-tax.php excl | tail -1 | tr -d '\r')
          echo "tax excl: $OUT"
          PAID=$(echo "$OUT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["paid"])')
          REWARD=$(echo "$OUT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["reward"])')
          MODE=excl PAID_ID="$PAID" REWARD_ID="$REWARD" REWARD_PRICE=20 \
            DISCOUNT_PERCENT=50 TAX_RATE=10 node tests/integration/tax.test.mjs

      - name: Tax, prices including tax
        run: |
          C="docker compose -f tests/integration/docker-compose.yml exec -T cli"
          OUT=$($C wp eval-file /integration/setup-tax.php incl | tail -1 | tr -d '\r')
          echo "tax incl: $OUT"
          PAID=$(echo "$OUT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["paid"])')
          REWARD=$(echo "$OUT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["reward"])')
          MODE=incl PAID_ID="$PAID" REWARD_ID="$REWARD" REWARD_PRICE=20 \
            DISCOUNT_PERCENT=50 TAX_RATE=10 node tests/integration/tax.test.mjs

      # Only lines naming this plugin's own files fail the build. WordPress and
      # WooCommerce raise deprecations of their own that no change here can fix,
      # and failing on those would make the check something to switch off.
      - name: Fail on PHP notices from the plugin
        if: always()
        run: |
          docker compose -f tests/integration/docker-compose.yml exec -T wp \
            cat /var/www/html/wp-content/debug.log > debug.log 2>/dev/null || true

          if [ ! -s debug.log ]; then
            echo "No debug log written — WP_DEBUG raised nothing."
            exit 0
          fi

          echo "--- debug.log ---"
          cat debug.log

          if grep -n 'plugins/bogo-select/' debug.log; then
            echo "::error::WP_DEBUG logged the lines above against this plugin."
            exit 1
          fi

          echo "Nothing in the log names this plugin."

      - name: Container logs on failure
        if: failure()
        run: docker compose -f tests/integration/docker-compose.yml logs --tail=120

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blocks-${{ matrix.woocommerce }}
          path: integration-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose -f tests/integration/docker-compose.yml down -v
