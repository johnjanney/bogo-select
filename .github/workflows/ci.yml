name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.0', '8.1', '8.2', '8.3' ]

    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint PHP
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run unit tests
        run: ./vendor/bin/phpunit

  static:
    name: Syntax and shell checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Check JavaScript syntax
        run: for f in assets/js/*.js; do node --check "$f"; done

      - name: Check build script syntax
        run: bash -n bin/build-zip.sh bin/verify-zip.sh

  package:
    name: Package parity
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # A green test suite says nothing about what was packaged: v1.2.0 was
      # built before its own fix landed and shipped a superseded class
      # (CODEX-REVIEW.md M-01). Building the archive and diffing it against the
      # worktree is the check that would have caught it.
      - name: Build the plugin zip
        run: bash bin/build-zip.sh

      - name: Verify the zip matches the source
        run: bash bin/verify-zip.sh
